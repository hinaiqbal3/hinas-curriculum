<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narrative Medicine — Hina's Curriculum</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f0e8fa;
      color: #765496;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    button, input, textarea {
      font: inherit;
      font-weight: 300;
    }

    .page {
      width: min(1120px, calc(100% - 80px));
      margin: 0 auto;
      padding: 55px 0 120px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .16em;
    }

    .topline a {
      color: inherit;
      text-decoration: none;
      opacity: .65;
    }

    h1 {
      margin: 105px 0 18px;
      font-size: clamp(58px, 9vw, 112px);
      line-height: .9;
      font-weight: 300;
      letter-spacing: -.065em;
    }

    .intro {
      max-width: 570px;
      margin: 0;
      font-size: 16px;
      line-height: 1.65;
      opacity: .68;
    }

    .composer-wrap {
      margin-top: 75px;
      display: flex;
      justify-content: center;
    }

    .composer {
      width: min(590px, 100%);
      min-height: 135px;
      padding: 28px 42px;
      border: 2px solid rgba(118,84,150,.28);
      border-radius: 50%;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255,255,255,.08);
    }

    .composer textarea {
      flex: 1;
      min-height: 68px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font-size: 21px;
      line-height: 1.45;
      text-align: center;
    }

    .composer textarea::placeholder,
    .add-area textarea::placeholder {
      color: rgba(118,84,150,.4);
    }

    .composer button {
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 28px;
      cursor: pointer;
      opacity: .65;
    }

    .status {
      min-height: 18px;
      margin-top: 13px;
      text-align: center;
      font-size: 11px;
      opacity: .5;
    }

    .field {
      position: relative;
      min-height: 700px;
      margin-top: 80px;
    }

    .bubble {
      position: absolute;
      border: 2px solid rgba(118,84,150,.30);
      background: rgba(255,255,255,.07);
      color: inherit;
      border-radius: 48% 52% 46% 54% / 55% 45% 55% 45%;
      padding: 34px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition:
        transform .3s ease,
        background .3s ease,
        border-radius .3s ease;
    }

    .bubble:nth-child(2n) {
      border-radius: 54% 46% 53% 47% / 45% 56% 44% 55%;
    }

    .bubble:nth-child(3n) {
      border-radius: 46% 54% 44% 56% / 53% 47% 55% 45%;
    }

    .bubble:hover {
      transform: scale(1.025);
      background: rgba(255,255,255,.2);
    }

    .bubble-text {
      font-size: 25px;
      line-height: 1.42;
      letter-spacing: -.018em;
    }

    .bubble-time {
      margin-top: 16px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .1em;
      opacity: .42;
    }

    .empty {
      text-align: center;
      font-size: 13px;
      opacity: .4;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow-y: auto;
      background: rgba(240,232,250,.985);
    }

    .overlay.open {
      display: block;
    }

    .expanded {
      width: min(790px, calc(100% - 40px));
      margin: 55px auto 100px;
      min-height: 620px;
      padding: 65px 75px;
      border: 2px solid rgba(118,84,150,.22);
      border-radius: 12% 9% 11% 8% / 8% 12% 9% 11%;
      position: relative;
    }

    .close {
      position: absolute;
      top: 28px;
      right: 34px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 12px;
      opacity: .55;
    }

    .original {
      margin-top: 30px;
    }

    .original-text {
      font-size: clamp(29px, 4.5vw, 45px);
      line-height: 1.25;
      letter-spacing: -.035em;
      white-space: pre-wrap;
    }

    .timestamp {
      margin-top: 17px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .11em;
      opacity: .42;
    }

    .tiny-action {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      margin-top: 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      cursor: pointer;
      opacity: .42;
    }

    .tiny-action:hover {
      opacity: .9;
    }

    .edit-box {
      width: 100%;
      min-height: 120px;
      border: 0;
      outline: 0;
      resize: vertical;
      background: rgba(255,255,255,.18);
      color: inherit;
      padding: 18px 20px;
      border-radius: 30px;
      font-size: 18px;
      line-height: 1.55;
    }

    .edit-original {
      font-size: 27px;
      min-height: 160px;
    }

    .edit-actions {
      display: flex;
      gap: 18px;
      margin-top: 12px;
    }

    .entries {
      margin-top: 65px;
    }

    .entry {
      margin: 0 0 48px 0;
      max-width: 610px;
    }

    .entry:nth-child(even) {
      margin-left: 7%;
    }

    .entry-text {
      font-size: 19px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .add-area {
      margin: 65px auto 0;
      width: min(560px, 100%);
      padding: 30px 38px;
      border: 2px solid rgba(118,84,150,.22);
      border-radius: 48% 52% 50% 50% / 52% 47% 53% 48%;
    }

    .add-area textarea {
      width: 100%;
      min-height: 95px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font-size: 17px;
      line-height: 1.6;
      text-align: center;
    }

    .add-row {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    .add-row button {
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .11em;
      cursor: pointer;
      opacity: .55;
    }

    .panel-status {
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      opacity: .5;
    }

    .delete-wrap {
      margin-top: 75px;
      text-align: center;
    }

    .delete {
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .12em;
      cursor: pointer;
      opacity: .3;
    }

    .delete:hover {
      opacity: .8;
    }


    /* Narrative Medicine concept map */
    .map-tools {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .map-tool {
      border: 1.5px solid rgba(118,84,150,.30);
      background: rgba(255,255,255,.08);
      color: inherit;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .11em;
      cursor: pointer;
      opacity: .68;
    }

    .map-tool:hover,
    .map-tool.active {
      opacity: 1;
      background: rgba(255,255,255,.28);
    }

    .map-hint {
      width: 100%;
      min-height: 17px;
      text-align: center;
      font-size: 11px;
      opacity: .48;
    }

    .field {
      isolation: isolate;
    }

    .connection-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 0;
    }

    .connection-line {
      stroke: rgba(118,84,150,.32);
      stroke-width: 2;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .bubble {
      z-index: 1;
      touch-action: none;
      user-select: none;
    }

    .bubble.dragging {
      transition: none !important;
      transform: scale(1.02);
      background: rgba(255,255,255,.25);
      cursor: grabbing;
    }

    .bubble.connect-source {
      background: rgba(255,255,255,.34);
      border-color: rgba(118,84,150,.75);
      box-shadow: 0 0 0 5px rgba(118,84,150,.08);
    }

    .connections-panel {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid rgba(118,84,150,.16);
    }

    .connections-heading {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      opacity: .45;
      margin-bottom: 14px;
    }

    .connection-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 8px 0;
      padding: 10px 14px;
      border: 1px solid rgba(118,84,150,.16);
      border-radius: 999px;
      font-size: 13px;
    }

    .connection-chip button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .1em;
      opacity: .45;
    }

    .connection-chip button:hover { opacity: .9; }


    /* Overview mode: zooms out the whole concept map without changing bubbles */
    .overview-stage {
      margin-top: 80px;
      position: relative;
      width: 100%;
    }

    .overview-stage .field {
      margin-top: 0;
      transform-origin: top left;
    }

    .overview-stage.overview-active {
      overflow: hidden;
      min-height: 420px;
    }

    .overview-toggle-wrap {
      display: flex;
      justify-content: center;
      margin-top: 44px;
    }

    .overview-toggle {
      border: 1.5px solid rgba(118,84,150,.30);
      background: rgba(255,255,255,.08);
      color: inherit;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      cursor: pointer;
      opacity: .68;
    }

    .overview-toggle:hover,
    .overview-toggle.active {
      opacity: 1;
      background: rgba(255,255,255,.28);
    }

    @media (max-width: 720px) {
      .map-tools { margin-top: 28px; }
      .map-tool { padding: 9px 13px; }
      .connection-layer { display: none; }
      .bubble { touch-action: auto; }
    }

    @media (max-width: 720px) {
      .page {
        width: calc(100% - 40px);
        padding-top: 35px;
      }

      h1 {
        margin-top: 75px;
        font-size: clamp(52px, 16vw, 82px);
      }

      .composer-wrap { margin-top: 55px; }

      .composer { padding: 25px 28px; }

      .composer textarea { font-size: 18px; }

      .field {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        min-height: 400px;
      }

      .bubble {
        position: relative;
        left: auto !important;
        top: auto !important;
        width: min(92%, 380px) !important;
        min-height: 150px !important;
      }

      .bubble-text { font-size: 22px; }

      .expanded {
        margin-top: 20px;
        padding: 60px 28px;
        border-radius: 45px;
      }

      .entry:nth-child(even) {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="topline">
      <a href="index.html">← The Index</a>
      <span>Hina's Curriculum</span>
    </div>

    <h1>narrative medicine</h1>

    <p class="intro">
      readings, reflective practices, curriculum ideas, research questions,
      and the work of understanding how narrative can change medical practice.
    </p>

    <div class="composer-wrap">
      <form class="composer" id="thoughtForm">
        <textarea
          id="thoughtInput"
          placeholder="something to explore..."
          maxlength="500"
        ></textarea>

        <button type="submit" aria-label="Add thought">+</button>
      </form>
    </div>

    <div class="status" id="status"></div>

    <div class="map-tools">
      <button class="map-tool" id="connectModeButton" type="button">connect ideas</button>
      <button class="map-tool" id="resetMapButton" type="button">reset arrangement</button>
      <div class="map-hint" id="mapHint">drag a thought to move it · click to open it</div>
    </div>

    <div class="overview-stage" id="overviewStage">
      <section class="field" id="field"></section>
    </div>

    <div class="overview-toggle-wrap">
      <button class="overview-toggle" id="overviewToggle" type="button">overview</button>
    </div>

  </main>


  <div class="overlay" id="overlay">

    <article class="expanded">

      <button class="close" id="closeButton">close ×</button>

      <section class="original" id="original"></section>

      <section class="entries" id="entries"></section>

      <section class="connections-panel" id="connectionsPanel"></section>

      <form class="add-area" id="entryForm">

        <textarea
          id="entryInput"
          placeholder="develop this..."
        ></textarea>

        <div class="add-row">
          <button type="submit">add +</button>
        </div>

      </form>

      <div class="panel-status" id="panelStatus"></div>

      <div class="delete-wrap">
        <button class="delete" id="deleteButton" type="button">
          delete
        </button>
      </div>

    </article>

  </div>


  <script>
    const section = "narrative-medicine";

    const form = document.getElementById("thoughtForm");
    const input = document.getElementById("thoughtInput");
    const field = document.getElementById("field");
    const status = document.getElementById("status");

    const overlay = document.getElementById("overlay");
    const original = document.getElementById("original");
    const entries = document.getElementById("entries");
    const connectionsPanel = document.getElementById("connectionsPanel");

    const entryForm = document.getElementById("entryForm");
    const entryInput = document.getElementById("entryInput");
    const panelStatus = document.getElementById("panelStatus");

    const closeButton = document.getElementById("closeButton");
    const deleteButton = document.getElementById("deleteButton");
    const connectModeButton = document.getElementById("connectModeButton");
    const resetMapButton = document.getElementById("resetMapButton");
    const mapHint = document.getElementById("mapHint");
    const overviewStage = document.getElementById("overviewStage");
    const overviewToggle = document.getElementById("overviewToggle");

    let currentThoughtId = null;
    let thoughtsCache = [];
    let connectionsCache = [];
    let positionsCache = {};
    let connectMode = false;
    let connectSourceId = null;
    let dragState = null;
    let overviewMode = false;
    let overviewScale = 1;

    function formatDate(value) {
      if (!value) return "";
      const utc = value.includes("T") ? value : value.replace(" ", "T") + "Z";
      const date = new Date(utc);
      const datePart = date.toLocaleDateString(undefined, {
        month: "short", day: "numeric", year: "numeric"
      });
      const timePart = date.toLocaleTimeString(undefined, {
        hour: "numeric", minute: "2-digit"
      });
      return `${datePart} · ${timePart}`;
    }

    function bubbleSize(text) {
      const length = text.length;
      if (length < 55) return { width: 230, height: 155 };
      if (length < 120) return { width: 300, height: 190 };
      if (length < 220) return { width: 350, height: 225 };
      return { width: 390, height: 255 };
    }

    function defaultPosition(index) {
      const positions = [
        [10, 10], [430, 70], [760, 10], [90, 300],
        [550, 350], [10, 590], [720, 620], [330, 800]
      ];
      const base = positions[index % positions.length];
      const cycle = Math.floor(index / positions.length);
      return { x: base[0], y: base[1] + cycle * 930 };
    }

    function ensureSvg() {
      let svg = field.querySelector(".connection-layer");
      if (!svg) {
        svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.classList.add("connection-layer");
        field.prepend(svg);
      }
      return svg;
    }

    function getBubble(id) {
      return field.querySelector(`.bubble[data-thought-id="${id}"]`);
    }

    function bubbleCenter(bubble) {
      return {
        x: bubble.offsetLeft + bubble.offsetWidth / 2,
        y: bubble.offsetTop + bubble.offsetHeight / 2
      };
    }

    // Return the point where a line toward targetCenter meets the bubble border.
    // This keeps connection lines outside the bubbles instead of drawing through them.
    function bubbleBorderPoint(bubble, targetCenter) {
      const center = bubbleCenter(bubble);
      const dx = targetCenter.x - center.x;
      const dy = targetCenter.y - center.y;

      if (dx === 0 && dy === 0) return center;

      // Treat the organic bubble as an ellipse for a clean visual intersection.
      const rx = bubble.offsetWidth / 2;
      const ry = bubble.offsetHeight / 2;
      const scale = 1 / Math.sqrt(
        (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry)
      );

      return {
        x: center.x + dx * scale,
        y: center.y + dy * scale
      };
    }

    function drawConnections() {
      if (window.innerWidth <= 720) return;
      const svg = ensureSvg();
      svg.innerHTML = "";
      svg.setAttribute("width", field.scrollWidth);
      svg.setAttribute("height", field.scrollHeight);
      svg.setAttribute("viewBox", `0 0 ${field.scrollWidth} ${field.scrollHeight}`);

      connectionsCache.forEach(connection => {
        const a = getBubble(connection.thought_a_id);
        const b = getBubble(connection.thought_b_id);
        if (!a || !b) return;

        const centerA = bubbleCenter(a);
        const centerB = bubbleCenter(b);
        const p1 = bubbleBorderPoint(a, centerB);
        const p2 = bubbleBorderPoint(b, centerA);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.classList.add("connection-line");
        line.setAttribute("x1", p1.x);
        line.setAttribute("y1", p1.y);
        line.setAttribute("x2", p2.x);
        line.setAttribute("y2", p2.y);
        svg.appendChild(line);
      });
    }

    function updateFieldHeight() {
      if (window.innerWidth <= 720) return;
      let greatestBottom = 700;
      field.querySelectorAll(".bubble").forEach(bubble => {
        greatestBottom = Math.max(
          greatestBottom,
          bubble.offsetTop + bubble.offsetHeight + 120
        );
      });
      field.style.minHeight = greatestBottom + "px";
      drawConnections();
    }


    function mapBounds() {
      const bubbles = [...field.querySelectorAll(".bubble")];
      if (!bubbles.length) return { width: field.clientWidth, height: 520 };

      let maxRight = field.clientWidth;
      let maxBottom = 520;

      bubbles.forEach(bubble => {
        maxRight = Math.max(maxRight, bubble.offsetLeft + bubble.offsetWidth + 40);
        maxBottom = Math.max(maxBottom, bubble.offsetTop + bubble.offsetHeight + 40);
      });

      return { width: maxRight, height: maxBottom };
    }

    function applyOverview() {
      if (!overviewMode || window.innerWidth <= 720) {
        overviewScale = 1;
        field.style.transform = "";
        field.style.width = "";
        overviewStage.style.height = "";
        overviewStage.classList.remove("overview-active");
        overviewToggle.classList.remove("active");
        overviewToggle.textContent = "overview";
        drawConnections();
        return;
      }

      const bounds = mapBounds();
      const availableWidth = overviewStage.clientWidth;
      const targetHeight = Math.min(700, Math.max(500, window.innerHeight * 0.68));

      overviewScale = Math.min(
        1,
        availableWidth / bounds.width,
        targetHeight / bounds.height
      );

      overviewScale = Math.max(0.18, overviewScale * 0.96);

      field.style.width = bounds.width + "px";
      field.style.transform = `scale(${overviewScale})`;
      overviewStage.style.height = Math.max(420, bounds.height * overviewScale) + "px";
      overviewStage.classList.add("overview-active");
      overviewToggle.classList.add("active");
      overviewToggle.textContent = "normal view";
      drawConnections();
    }

    function setOverview(on) {
      overviewMode = on && window.innerWidth > 720;
      applyOverview();

      mapHint.textContent = overviewMode
        ? "overview · drag and connect while seeing the whole constellation"
        : connectMode
          ? "click one thought, then another · click “connecting…” to cancel"
          : "drag a thought to move it · click to open it";
    }

    function setConnectMode(on) {
      connectMode = on;
      connectSourceId = null;
      connectModeButton.classList.toggle("active", on);
      connectModeButton.textContent = on ? "connecting…" : "connect ideas";
      field.querySelectorAll(".bubble").forEach(b => b.classList.remove("connect-source"));
      mapHint.textContent = on
        ? "click one thought, then another · click “connecting…” to cancel"
        : "drag a thought to move it · click to open it";
    }

    async function connectThoughts(a, b) {
      status.textContent = "connecting...";
      try {
        const response = await fetch("/api/connections", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            section,
            thought_a_id: a,
            thought_b_id: b
          })
        });
        if (!response.ok) throw new Error();
        await loadConnections();
        status.textContent = "";
        setConnectMode(false);
      } catch {
        status.textContent = "couldn't connect those.";
      }
    }

    function handleConnectClick(id) {
      if (!connectSourceId) {
        connectSourceId = id;
        const bubble = getBubble(id);
        if (bubble) bubble.classList.add("connect-source");
        mapHint.textContent = "now click the thought you want to connect it to";
        return;
      }

      if (connectSourceId === id) {
        const bubble = getBubble(id);
        if (bubble) bubble.classList.remove("connect-source");
        connectSourceId = null;
        mapHint.textContent = "click one thought, then another";
        return;
      }

      connectThoughts(connectSourceId, id);
    }

    function attachDrag(bubble, thoughtId) {
      bubble.addEventListener("pointerdown", event => {
        if (window.innerWidth <= 720 || connectMode) return;
        if (event.button !== undefined && event.button !== 0) return;

        dragState = {
          id: thoughtId,
          bubble,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originalLeft: bubble.offsetLeft,
          originalTop: bubble.offsetTop,
          moved: false
        };

        bubble.setPointerCapture(event.pointerId);
      });

      bubble.addEventListener("pointermove", event => {
        if (!dragState || dragState.bubble !== bubble) return;

        const scale = overviewMode ? overviewScale : 1;
        const dx = (event.clientX - dragState.startX) / scale;
        const dy = (event.clientY - dragState.startY) / scale;

        if (!dragState.moved && Math.hypot(dx, dy) < 5) return;

        dragState.moved = true;
        bubble.classList.add("dragging");

        const maxX = Math.max(0, field.clientWidth - bubble.offsetWidth);
        const nextX = Math.min(maxX, Math.max(0, dragState.originalLeft + dx));
        const nextY = Math.max(0, dragState.originalTop + dy);

        bubble.style.left = nextX + "px";
        bubble.style.top = nextY + "px";
        updateFieldHeight();
      });

      const finishDrag = async event => {
        if (!dragState || dragState.bubble !== bubble) return;

        const moved = dragState.moved;
        bubble.classList.remove("dragging");

        if (moved) {
          const x = bubble.offsetLeft;
          const y = bubble.offsetTop;
          positionsCache[thoughtId] = { x, y };

          // The browser fires a click after pointerup. Keep this flag set until
          // that click is consumed so dragging never opens the thought.
          bubble.dataset.suppressClick = "true";

          try {
            await fetch("/api/positions", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ thought_id: thoughtId, x, y })
            });
          } catch {}
        }

        dragState = null;
        updateFieldHeight();
      };

      bubble.addEventListener("pointerup", finishDrag);
      bubble.addEventListener("pointercancel", finishDrag);
    }

    function drawThoughts(thoughts) {
      field.innerHTML = "";

      if (!thoughts.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "this space is waiting for its first question.";
        field.appendChild(empty);
        return;
      }

      if (window.innerWidth > 720) ensureSvg();

      thoughts.forEach((thought, index) => {
        const bubble = document.createElement("button");
        bubble.type = "button";
        bubble.className = "bubble";
        bubble.dataset.thoughtId = thought.id;

        const size = bubbleSize(thought.title);
        const saved = positionsCache[thought.id];
        const position = saved || defaultPosition(index);

        bubble.style.left = position.x + "px";
        bubble.style.top = position.y + "px";
        bubble.style.width = size.width + "px";
        bubble.style.minHeight = size.height + "px";

        const text = document.createElement("div");
        text.className = "bubble-text";
        text.textContent = thought.title;

        const time = document.createElement("div");
        time.className = "bubble-time";
        time.textContent = formatDate(thought.created_at);

        bubble.appendChild(text);
        bubble.appendChild(time);

        bubble.addEventListener("click", () => {
          if (bubble.dataset.suppressClick === "true") {
            bubble.dataset.suppressClick = "false";
            return;
          }

          if (connectMode) {
            handleConnectClick(thought.id);
          } else {
            openThought(thought.id);
          }
        });

        attachDrag(bubble, thought.id);
        field.appendChild(bubble);
      });

      updateFieldHeight();
    }

    async function loadPositions() {
      try {
        const response = await fetch(
          "/api/positions?section=" + encodeURIComponent(section)
        );
        if (!response.ok) throw new Error();
        const positions = await response.json();
        positionsCache = {};
        positions.forEach(p => {
          positionsCache[p.thought_id] = {
            x: Number(p.x),
            y: Number(p.y)
          };
        });
      } catch {
        positionsCache = {};
      }
    }

    async function loadConnections() {
      try {
        const response = await fetch(
          "/api/connections?section=" + encodeURIComponent(section)
        );
        if (!response.ok) throw new Error();
        connectionsCache = await response.json();
        drawConnections();
      } catch {
        connectionsCache = [];
      }
    }

    async function loadThoughts() {
      try {
        const [thoughtResponse] = await Promise.all([
          fetch("/api/thoughts?section=" + encodeURIComponent(section)),
          loadPositions(),
          loadConnections()
        ]);

        if (!thoughtResponse.ok) throw new Error();
        thoughtsCache = await thoughtResponse.json();
        drawThoughts(thoughtsCache);
        drawConnections();
      } catch {
        status.textContent = "couldn't load.";
      }
    }

    async function openThought(id) {
      currentThoughtId = id;
      panelStatus.textContent = "";

      try {
        const response = await fetch("/api/thoughts/" + id);
        if (!response.ok) throw new Error();
        const thought = await response.json();

        drawOriginal(thought);
        drawEntries(thought.entries);
        drawThoughtConnections(id);

        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
      } catch {
        status.textContent = "couldn't open that.";
      }
    }

    function drawThoughtConnections(id) {
      connectionsPanel.innerHTML = "";

      const related = connectionsCache.filter(c =>
        Number(c.thought_a_id) === Number(id) ||
        Number(c.thought_b_id) === Number(id)
      );

      if (!related.length) return;

      const heading = document.createElement("div");
      heading.className = "connections-heading";
      heading.textContent = "connected ideas";
      connectionsPanel.appendChild(heading);

      related.forEach(connection => {
        const otherId =
          Number(connection.thought_a_id) === Number(id)
            ? Number(connection.thought_b_id)
            : Number(connection.thought_a_id);

        const other = thoughtsCache.find(t => Number(t.id) === otherId);
        if (!other) return;

        const chip = document.createElement("div");
        chip.className = "connection-chip";

        const label = document.createElement("span");
        label.textContent = other.title;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "disconnect";

        remove.addEventListener("click", async () => {
          panelStatus.textContent = "disconnecting...";
          try {
            const response = await fetch(
              "/api/connections/" + connection.id,
              { method: "DELETE" }
            );
            if (!response.ok) throw new Error();
            await loadConnections();
            drawThoughtConnections(id);
            panelStatus.textContent = "";
          } catch {
            panelStatus.textContent = "couldn't remove that connection.";
          }
        });

        chip.appendChild(label);
        chip.appendChild(remove);
        connectionsPanel.appendChild(chip);
      });
    }

    function drawOriginal(thought) {
      original.innerHTML = "";

      const text = document.createElement("div");
      text.className = "original-text";
      text.textContent = thought.title;

      const time = document.createElement("div");
      time.className = "timestamp";
      time.textContent = formatDate(thought.created_at);

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "tiny-action";
      edit.textContent = "edit";
      edit.addEventListener("click", () => showOriginalEditor(thought));

      original.appendChild(text);
      original.appendChild(time);
      original.appendChild(edit);
    }

    function showOriginalEditor(thought) {
      original.innerHTML = "";

      const textarea = document.createElement("textarea");
      textarea.className = "edit-box edit-original";
      textarea.value = thought.title;

      const actions = document.createElement("div");
      actions.className = "edit-actions";

      const save = document.createElement("button");
      save.type = "button";
      save.className = "tiny-action";
      save.textContent = "save";

      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "tiny-action";
      cancel.textContent = "cancel";

      save.addEventListener("click", async () => {
        const title = textarea.value.trim();
        if (!title) return;
        panelStatus.textContent = "saving...";

        try {
          const response = await fetch("/api/thoughts/" + thought.id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title })
          });
          if (!response.ok) throw new Error();

          panelStatus.textContent = "";
          await loadThoughts();
          await openThought(thought.id);
        } catch {
          panelStatus.textContent = "couldn't save that edit.";
        }
      });

      cancel.addEventListener("click", () => drawOriginal(thought));

      actions.appendChild(save);
      actions.appendChild(cancel);
      original.appendChild(textarea);
      original.appendChild(actions);
      textarea.focus();
    }

    function drawEntries(thoughtEntries) {
      entries.innerHTML = "";

      thoughtEntries.forEach(entry => {
        const wrapper = document.createElement("article");
        wrapper.className = "entry";

        const text = document.createElement("div");
        text.className = "entry-text";
        text.textContent = entry.content;

        const time = document.createElement("div");
        time.className = "timestamp";
        time.textContent = formatDate(entry.created_at);

        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "tiny-action";
        edit.textContent = "edit";
        edit.addEventListener("click", () => showEntryEditor(wrapper, entry));

        wrapper.appendChild(text);
        wrapper.appendChild(time);
        wrapper.appendChild(edit);
        entries.appendChild(wrapper);
      });
    }

    function showEntryEditor(wrapper, entry) {
      wrapper.innerHTML = "";

      const textarea = document.createElement("textarea");
      textarea.className = "edit-box";
      textarea.value = entry.content;

      const actions = document.createElement("div");
      actions.className = "edit-actions";

      const save = document.createElement("button");
      save.type = "button";
      save.className = "tiny-action";
      save.textContent = "save";

      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "tiny-action";
      cancel.textContent = "cancel";

      save.addEventListener("click", async () => {
        const content = textarea.value.trim();
        if (!content) return;
        panelStatus.textContent = "saving...";

        try {
          const response = await fetch("/api/entries/" + entry.id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content })
          });
          if (!response.ok) throw new Error();
          panelStatus.textContent = "";
          await openThought(currentThoughtId);
        } catch {
          panelStatus.textContent = "couldn't save that edit.";
        }
      });

      cancel.addEventListener("click", () => openThought(currentThoughtId));

      actions.appendChild(save);
      actions.appendChild(cancel);
      wrapper.appendChild(textarea);
      wrapper.appendChild(actions);
      textarea.focus();
    }

    function closeThought() {
      overlay.classList.remove("open");
      document.body.style.overflow = "";
      currentThoughtId = null;
      entryInput.value = "";
      panelStatus.textContent = "";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      status.textContent = "adding...";

      try {
        const response = await fetch("/api/thoughts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ section, title })
        });
        if (!response.ok) throw new Error();

        input.value = "";
        status.textContent = "";
        await loadThoughts();
      } catch {
        status.textContent = "couldn't save that.";
      }
    });

    entryForm.addEventListener("submit", async event => {
      event.preventDefault();
      const content = entryInput.value.trim();
      if (!content || !currentThoughtId) return;
      panelStatus.textContent = "adding...";

      try {
        const response = await fetch(
          "/api/thoughts/" + currentThoughtId + "/entries",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content })
          }
        );
        if (!response.ok) throw new Error();

        entryInput.value = "";
        panelStatus.textContent = "";
        await openThought(currentThoughtId);
      } catch {
        panelStatus.textContent = "couldn't add that.";
      }
    });

    deleteButton.addEventListener("click", async () => {
      if (!currentThoughtId) return;

      const confirmed = window.confirm(
        "Delete this and everything you've added to it?"
      );
      if (!confirmed) return;

      try {
        const response = await fetch(
          "/api/thoughts/" + currentThoughtId,
          { method: "DELETE" }
        );
        if (!response.ok) throw new Error();

        closeThought();
        await loadThoughts();
      } catch {
        panelStatus.textContent = "couldn't delete that.";
      }
    });

    connectModeButton.addEventListener("click", () => {
      setConnectMode(!connectMode);
    });

    resetMapButton.addEventListener("click", async () => {
      const confirmed = window.confirm(
        "Reset the visual arrangement of your bubbles? Your thoughts and connections will stay."
      );
      if (!confirmed) return;

      positionsCache = {};
      thoughtsCache.forEach((thought, index) => {
        const pos = defaultPosition(index);
        positionsCache[thought.id] = pos;
        fetch("/api/positions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            thought_id: thought.id,
            x: pos.x,
            y: pos.y
          })
        }).catch(() => {});
      });

      drawThoughts(thoughtsCache);
      status.textContent = "";
    });

    overviewToggle.addEventListener("click", () => {
      setOverview(!overviewMode);
    });

    closeButton.addEventListener("click", closeThought);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeThought();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        if (overlay.classList.contains("open")) {
          closeThought();
        } else if (connectMode) {
          setConnectMode(false);
        }
      }
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth <= 720 && overviewMode) overviewMode = false;
      drawThoughts(thoughtsCache);
      requestAnimationFrame(applyOverview);
    });

    loadThoughts();
  </script>
<audio id="siteMusic" loop preload="auto">
  <source src="doria.mp3" type="audio/mpeg">
</audio>

<div class="music-player">
  <button class="music-button" id="musicButton" type="button" aria-label="Play music">
    <span class="play-icon"></span>
  </button>
</div>

<style>
  .music-player {
    position: fixed;
    right: 30px;
    bottom: 30px;
    z-index: 100;
  }

  .music-button {
    width: 54px;
    height: 54px;
    padding: 0;
    border: 4px solid currentColor;
    border-radius: 48% 52% 50% 46% / 51% 47% 53% 49%;
    background: rgba(255, 255, 255, 0.12);
    color: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      transform 0.25s ease,
      background 0.25s ease;
  }

  .music-button:hover {
    transform: scale(1.06);
    background: rgba(255, 255, 255, 0.25);
  }

  .play-icon {
    width: 0;
    height: 0;
    margin-left: 3px;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 11px solid currentColor;
  }

  .music-button.playing .play-icon {
    width: 11px;
    height: 15px;
    margin-left: 0;
    border: 0;
    border-left: 4px solid currentColor;
    border-right: 4px solid currentColor;
  }

  @media (max-width: 720px) {
    .music-player {
      right: 20px;
      bottom: 20px;
    }

    .music-button {
      width: 48px;
      height: 48px;
      border-width: 3px;
    }
  }
</style>

<script>
  const musicButton = document.getElementById("musicButton");
  const siteMusic = document.getElementById("siteMusic");

  const savedTime = parseFloat(localStorage.getItem("musicTime")) || 0;
  const wasPlaying = localStorage.getItem("musicPlaying") === "true";

  siteMusic.addEventListener("loadedmetadata", async () => {
    if (savedTime < siteMusic.duration) {
      siteMusic.currentTime = savedTime;
    }

    if (wasPlaying) {
      try {
        await siteMusic.play();
        musicButton.classList.add("playing");
        musicButton.setAttribute("aria-label", "Pause music");
      } catch (error) {
        // If autoplay is blocked, the next click resumes from the saved spot.
      }
    }
  });

  musicButton.addEventListener("click", async () => {
    if (siteMusic.paused) {
      try {
        await siteMusic.play();
        localStorage.setItem("musicPlaying", "true");
        musicButton.classList.add("playing");
        musicButton.setAttribute("aria-label", "Pause music");
      } catch (error) {
        console.log("Audio could not play:", error);
      }
    } else {
      siteMusic.pause();
      localStorage.setItem("musicPlaying", "false");
      localStorage.setItem("musicTime", siteMusic.currentTime);
      musicButton.classList.remove("playing");
      musicButton.setAttribute("aria-label", "Play music");
    }
  });

  siteMusic.addEventListener("timeupdate", () => {
    localStorage.setItem("musicTime", siteMusic.currentTime);
  });

  siteMusic.addEventListener("play", () => {
    localStorage.setItem("musicPlaying", "true");
  });

  siteMusic.addEventListener("pause", () => {
    localStorage.setItem("musicTime", siteMusic.currentTime);
  });

  window.addEventListener("pagehide", () => {
    localStorage.setItem("musicTime", siteMusic.currentTime);
    localStorage.setItem("musicPlaying", String(!siteMusic.paused));
  });
</script>
</body>
</html>
